description: Bad Request — validation or malformed payload
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: 'Validation error'
        details:
          description: 'Optional field-level errors (e.g., from Joi)'
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                example: 'email'
              message:
                type: string
                example: '"email" must be a valid email'
