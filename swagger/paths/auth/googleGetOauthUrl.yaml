tags:
  - Auth
summary: Get Google OAuth URL
operationId: getGoogleOAuthUrl
description: 'Return a Google OAuth URL to start the OAuth flow.'
security:
  - bearerAuth: []
responses:
  '200':
    description: OAuth URL issued
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully get Google OAuth url'
            data:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  example: 'https://accounts.google.com/o/oauth2/v2/auth?...'
  '401':
    $ref: ../../components/responses/401.yaml
