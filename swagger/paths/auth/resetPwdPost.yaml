tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: 'Reset password using a short-lived token from email'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [password, token]
        properties:
          password:
            type: string
            example: 'N3wStrongP@ss'
          token:
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6...'
responses:
  '200':
    description: Password has been successfully reset
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset.'
            data:
              type: object
              example: {}
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    $ref: ../../components/responses/404.yaml
